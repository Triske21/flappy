<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Flappy Golub</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; }
  body {
    background: #1a1a2e;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    width: 100vw;
    font-family: 'Arial', sans-serif;
  }
  canvas {
    border: 3px solid #e94560;
    border-radius: 8px;
    display: block;
    cursor: crosshair;
    max-width: 100vw;
    max-height: 100vh;
    width: auto;
    height: auto;
  }
  @media (max-width: 500px) {
    canvas { border-width: 0; border-radius: 0; height: 100vh; width: auto; }
  }
</style>
</head>
<body>
<canvas id="game" width="400" height="600"></canvas>
<div id="ytplayer" style="position:absolute;left:-9999px;width:1px;height:1px;"></div>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

const W = canvas.width;
const H = canvas.height;

// =================== GLOBAL LEADERBOARD ===================
// Podesi ove dve vrednosti sa jsonbin.io (uputstvo posle koda)
const JSONBIN_BIN_ID = '6a0c4e526877513b2798b597';   // <-- nalepi BIN ID ovde
const JSONBIN_KEY = '$2a$10$vu/9wQddqJsEGHhfAEYFOOczsunCGZPDGFvU7IcxaOWv8D770Opm2';      // <-- nalepi MASTER KEY ovde
const ONLINE_ENABLED = JSONBIN_BIN_ID !== '' && JSONBIN_KEY !== '';

// =================== BOSS 4 MUZIKA (YouTube) ===================
// Nadji video na YouTube-u (npr. "Vasko Zabata") i kopiraj ID iz URL-a
// URL primer: https://www.youtube.com/watch?v=XXXXXXXXXXX  ←  to "XXXXXXXXXXX" je ID
const BOSS4_YOUTUBE_ID = 'JZC4RHVdiWA';  // <-- zameni ovde sa stvarnim ID-em

let ytPlayer = null;
let ytReady = false;

window.onYouTubeIframeAPIReady = function() {
  ytPlayer = new YT.Player('ytplayer', {
    height: '1',
    width: '1',
    videoId: BOSS4_YOUTUBE_ID,
    playerVars: { autoplay: 0, controls: 0, disablekb: 1, fs: 0, modestbranding: 1, playsinline: 1 },
    events: {
      onReady: () => { ytReady = true; }
    }
  });
};

// Učitaj YouTube IFrame API dinamički POSLE definisanja funkcije
(function loadYTAPI() {
  const tag = document.createElement('script');
  tag.src = 'https://www.youtube.com/iframe_api';
  document.head.appendChild(tag);
})();

function playBossMusic() {
  if (!ytReady || !ytPlayer) return;
  try {
    ytPlayer.seekTo(0);
    ytPlayer.unMute();
    ytPlayer.setVolume(70);
    ytPlayer.playVideo();
  } catch (e) {}
}

function stopBossMusic() {
  if (!ytReady || !ytPlayer) return;
  try { ytPlayer.pauseVideo(); } catch (e) {}
}

// =================== TEST/DEBUG MODE (URL parametri) ===================
// Primeri:
//   ?start=55     -> kreneš sa skorom 55 (treba još 5 cevi do bossa 4)
//   ?boss=4       -> odmah ulaziš u borbu sa boss 4
//   ?start=45     -> testiraj boss 3 itd.
const urlParams = new URLSearchParams(window.location.search);
let urlStartScore = parseInt(urlParams.get('start'));
if (isNaN(urlStartScore) || urlStartScore < 0) urlStartScore = 0;
let urlStartBoss = parseInt(urlParams.get('boss'));
if (isNaN(urlStartBoss) || urlStartBoss < 1 || urlStartBoss > 4) urlStartBoss = 0;
const TEST_MODE = urlStartScore > 0 || urlStartBoss > 0;

let globalScores = [];
let globalStatus = ONLINE_ENABLED ? 'idle' : 'disabled';
let playerName = '';
try { playerName = localStorage.getItem('flappyGolubName') || ''; } catch (e) {}

async function fetchGlobalScores() {
  if (!ONLINE_ENABLED) return;
  globalStatus = 'loading';
  try {
    const r = await fetch('https://api.jsonbin.io/v3/b/' + JSONBIN_BIN_ID + '/latest', {
      headers: { 'X-Master-Key': JSONBIN_KEY }
    });
    if (!r.ok) throw new Error('http ' + r.status);
    const data = await r.json();
    globalScores = (data.record && data.record.scores) || [];
    globalScores.sort((a, b) => b.score - a.score);
    globalStatus = 'ok';
  } catch (e) {
    globalStatus = 'error';
  }
}

async function postGlobalScore(name, sc, bosses) {
  if (!ONLINE_ENABLED) return;
  try {
    const r = await fetch('https://api.jsonbin.io/v3/b/' + JSONBIN_BIN_ID + '/latest', {
      headers: { 'X-Master-Key': JSONBIN_KEY }
    });
    const data = await r.json();
    const current = (data.record && data.record.scores) || [];
    current.push({
      name: (name || 'Anonim').substring(0, 12),
      score: sc,
      bosses: bosses,
      date: new Date().toISOString()
    });
    current.sort((a, b) => b.score - a.score);
    const top = current.slice(0, 100);
    await fetch('https://api.jsonbin.io/v3/b/' + JSONBIN_BIN_ID, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json', 'X-Master-Key': JSONBIN_KEY },
      body: JSON.stringify({ scores: top })
    });
    globalScores = top;
    globalStatus = 'ok';
  } catch (e) {
    globalStatus = 'error';
  }
}

fetchGlobalScores();

// =================== STATE ===================
let state = 'menu'; // menu, playing, boss, dead, nameEntry, victory
let score = 0;
let hiScore = 0;
let frames = 0;
let bossesDefeated = 0;
let currentBossLevel = 0; // 1, 2, 3
const BOSS_TRIGGER = 15;

// High scores
let highScores = [];
function loadHighScores() {
  try {
    const s = localStorage.getItem('flappyGolubHighScores');
    if (s) highScores = JSON.parse(s);
  } catch (e) { highScores = []; }
  hiScore = highScores.length ? highScores[0].score : 0;
}
function saveHighScores() {
  try { localStorage.setItem('flappyGolubHighScores', JSON.stringify(highScores)); } catch (e) {}
}
function tryAddHighScore(name, sc) {
  highScores.push({ name: name || 'Anonim', score: sc, date: new Date().toLocaleDateString('sr-RS') });
  highScores.sort((a, b) => b.score - a.score);
  highScores = highScores.slice(0, 5);
  if (highScores.length && highScores[0].score > hiScore) hiScore = highScores[0].score;
  saveHighScores();
}
function isTopScore(sc) {
  if (sc <= 0) return false;
  if (highScores.length < 5) return true;
  return sc > highScores[highScores.length - 1].score;
}
loadHighScores();

// Physics
const GRAVITY = 0.4;
const FLAP = -7.5;
const PIPE_SPEED = 2.4;
const PIPE_GAP = 200;
const PIPE_INTERVAL = 110;

// Mouse tracking
let mouseX = W / 2;
let mouseY = H / 2;
canvas.addEventListener('mousemove', e => {
  const rect = canvas.getBoundingClientRect();
  mouseX = (e.clientX - rect.left) * (W / rect.width);
  mouseY = (e.clientY - rect.top) * (H / rect.height);
});

// =================== PIGEON ===================
const pigeon = {
  x: 80, y: H / 2, vy: 0,
  radius: 18, angle: 0, wingPhase: 0,

  reset() { this.y = H / 2; this.vy = 0; this.angle = 0; },
  flap() { this.vy = FLAP; },

  update() {
    if (state === 'menu' || state === 'dead' || state === 'victory' || state === 'nameEntry') return;
    this.vy += GRAVITY;
    this.y += this.vy;
    this.angle = Math.min(Math.PI / 4, Math.max(-Math.PI / 3, this.vy * 0.07));
    this.wingPhase += 0.35;
  },

  draw() {
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.angle);

    ctx.fillStyle = 'rgba(0,0,0,0.18)';
    ctx.beginPath();
    ctx.ellipse(2, 24, 20, 5, 0, 0, Math.PI * 2);
    ctx.fill();

    const wingFlap = Math.sin(this.wingPhase);

    // Tail
    ctx.fillStyle = '#4a5a7a';
    ctx.beginPath();
    ctx.moveTo(-20, 2);
    ctx.lineTo(-34, 8);
    ctx.lineTo(-30, 0);
    ctx.lineTo(-34, -6);
    ctx.lineTo(-20, -2);
    ctx.closePath();
    ctx.fill();

    // Body
    const bodyGrad = ctx.createRadialGradient(-4, -6, 4, 0, 0, 26);
    bodyGrad.addColorStop(0, '#a8c0d8');
    bodyGrad.addColorStop(0.6, '#6a82a0');
    bodyGrad.addColorStop(1, '#3a5070');
    ctx.fillStyle = bodyGrad;
    ctx.beginPath();
    ctx.ellipse(0, 2, 22, 18, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = 'rgba(220, 230, 240, 0.5)';
    ctx.beginPath();
    ctx.ellipse(-2, 8, 14, 9, 0, 0, Math.PI * 2);
    ctx.fill();

    // Wing
    const wingY = -2 + wingFlap * 4;
    const wingAngle = -0.2 + wingFlap * 0.3;
    ctx.save();
    ctx.translate(-2, wingY);
    ctx.rotate(wingAngle);
    const wingGrad = ctx.createLinearGradient(0, -10, 0, 10);
    wingGrad.addColorStop(0, '#7a92b0');
    wingGrad.addColorStop(1, '#3a5070');
    ctx.fillStyle = wingGrad;
    ctx.beginPath();
    ctx.ellipse(0, 0, 18, 11, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#2a3a5a';
    ctx.beginPath();
    ctx.ellipse(-12, 2, 6, 8, -0.3, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // Neck iridescence
    ctx.fillStyle = '#6a5a8a';
    ctx.beginPath();
    ctx.ellipse(12, -8, 9, 11, 0.2, 0, Math.PI * 2);
    ctx.fill();
    const irGrad = ctx.createLinearGradient(8, -14, 16, -2);
    irGrad.addColorStop(0, 'rgba(140, 220, 180, 0.6)');
    irGrad.addColorStop(0.5, 'rgba(180, 140, 220, 0.5)');
    irGrad.addColorStop(1, 'rgba(100, 150, 200, 0.3)');
    ctx.fillStyle = irGrad;
    ctx.beginPath();
    ctx.ellipse(12, -7, 7, 9, 0.2, 0, Math.PI * 2);
    ctx.fill();

    // Head
    const headGrad = ctx.createRadialGradient(16, -16, 2, 16, -14, 14);
    headGrad.addColorStop(0, '#b8c8dc');
    headGrad.addColorStop(1, '#5a7090');
    ctx.fillStyle = headGrad;
    ctx.beginPath();
    ctx.arc(16, -14, 13, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = 'rgba(255,255,255,0.25)';
    ctx.beginPath();
    ctx.ellipse(13, -19, 5, 3, -0.4, 0, Math.PI * 2);
    ctx.fill();

    // Eye
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(22, -15, 6, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#ff8800';
    ctx.beginPath();
    ctx.arc(22, -15, 4.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#cc4400';
    ctx.beginPath();
    ctx.arc(22, -15, 3.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.arc(23, -15, 2.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(24, -16, 1.2, 0, Math.PI * 2);
    ctx.fill();

    // Beak
    ctx.fillStyle = '#3a3a3a';
    ctx.beginPath();
    ctx.moveTo(26, -16);
    ctx.lineTo(36, -14);
    ctx.lineTo(36, -11);
    ctx.lineTo(26, -10);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#f0f0f0';
    ctx.beginPath();
    ctx.ellipse(28, -17, 4, 2, 0, 0, Math.PI * 2);
    ctx.fill();

    // Feet
    ctx.strokeStyle = '#ff6600';
    ctx.lineWidth = 2.5;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(-2, 18); ctx.lineTo(-4, 26);
    ctx.moveTo(-4, 26); ctx.lineTo(-9, 30);
    ctx.moveTo(-4, 26); ctx.lineTo(-4, 31);
    ctx.moveTo(-4, 26); ctx.lineTo(0, 30);
    ctx.moveTo(8, 18); ctx.lineTo(6, 26);
    ctx.moveTo(6, 26); ctx.lineTo(1, 30);
    ctx.moveTo(6, 26); ctx.lineTo(6, 31);
    ctx.moveTo(6, 26); ctx.lineTo(10, 30);
    ctx.stroke();

    ctx.restore();
  }
};

// =================== PIPES ===================
let pipes = [];
function createPipe() {
  const minY = 70;
  const maxY = H - 80 - PIPE_GAP;
  const topH = minY + Math.random() * (maxY - minY);
  pipes.push({ x: W + 30, topH, passed: false });
}

function updatePipes() {
  if (state !== 'playing') return;
  if (frames % PIPE_INTERVAL === 0) createPipe();
  pipes.forEach(p => { p.x -= PIPE_SPEED; });
  pipes = pipes.filter(p => p.x > -60);
  pipes.forEach(p => {
    if (!p.passed && p.x + 30 < pigeon.x) {
      p.passed = true;
      score++;
      if (score > 0 && score % BOSS_TRIGGER === 0 && bossesDefeated < MAX_BOSSES) {
        triggerBoss();
      }
    }
  });
}

const PIPE_W = 60;
const PIPE_CAP_H = 24;
const PIPE_CAP_EXTRA = 6;

function drawPipe(x, topH) {
  const tg = ctx.createLinearGradient(x, 0, x + PIPE_W, 0);
  tg.addColorStop(0, '#3a8a3a');
  tg.addColorStop(0.4, '#6aba5a');
  tg.addColorStop(1, '#2a6a2a');
  ctx.fillStyle = tg;
  ctx.fillRect(x + PIPE_CAP_EXTRA, 0, PIPE_W - PIPE_CAP_EXTRA * 2, topH - PIPE_CAP_H);

  const cg = ctx.createLinearGradient(x, 0, x + PIPE_W, 0);
  cg.addColorStop(0, '#4a9a4a');
  cg.addColorStop(0.4, '#7aca6a');
  cg.addColorStop(1, '#3a7a3a');
  ctx.fillStyle = cg;
  ctx.beginPath();
  ctx.roundRect(x, topH - PIPE_CAP_H, PIPE_W, PIPE_CAP_H, [4, 4, 0, 0]);
  ctx.fill();

  const bottomY = topH + PIPE_GAP;
  ctx.fillStyle = tg;
  ctx.fillRect(x + PIPE_CAP_EXTRA, bottomY + PIPE_CAP_H, PIPE_W - PIPE_CAP_EXTRA * 2, H - bottomY - PIPE_CAP_H);
  ctx.fillStyle = cg;
  ctx.beginPath();
  ctx.roundRect(x, bottomY, PIPE_W, PIPE_CAP_H, [0, 0, 4, 4]);
  ctx.fill();

  ctx.fillStyle = 'rgba(255,255,255,0.15)';
  ctx.fillRect(x + PIPE_CAP_EXTRA + 4, 0, 8, topH - PIPE_CAP_H);
  ctx.fillRect(x + PIPE_CAP_EXTRA + 4, bottomY + PIPE_CAP_H, 8, H - bottomY - PIPE_CAP_H);
}

// =================== BOSS ===================
const BOSS_CONFIGS = {
  1: {
    name: 'KRVAVI ORAO',
    hp: 5,
    shotInterval: 80,
    shotPattern: 'aimed', // single aimed
    color: '#7a1a2a',
    bgTheme: 'sunset'
  },
  2: {
    name: 'NOĆNI ŠIŠMIŠ',
    hp: 7,
    shotInterval: 110,
    shotPattern: 'spread', // 3 at once
    color: '#4a1a6a',
    bgTheme: 'storm'
  },
  3: {
    name: 'ZLATNI KRALJ',
    hp: 10,
    shotInterval: 50,
    shotPattern: 'rapid', // fast aimed
    color: '#aa7700',
    bgTheme: 'epic'
  },
  4: {
    name: 'AIR BULGARIA',
    hp: 15,
    shotInterval: 48,
    shotPattern: 'rapid', // brzo kao zlatni kralj
    color: '#00966e',
    bgTheme: 'sky'
  }
};
const MAX_BOSSES = 4;

const boss = {
  x: 0, y: 0,
  active: false,
  level: 1,
  hp: 5, maxHp: 5,
  shotTimer: 0,
  enterTimer: 0,
  exitTimer: 0,
  hitFlash: 0,
  bobPhase: 0,
  state: 'enter',
  config: null,

  start(level) {
    this.level = level;
    this.config = BOSS_CONFIGS[level];
    this.x = W + 80;
    this.y = 150;
    this.active = true;
    this.hp = this.config.hp;
    this.maxHp = this.config.hp;
    this.shotTimer = 90;
    this.enterTimer = 0;
    this.exitTimer = 0;
    this.hitFlash = 0;
    this.bobPhase = 0;
    this.state = 'enter';
    if (level === 4) playBossMusic();
  },

  hit() {
    this.hp--;
    this.hitFlash = 14;
    if (this.hp <= 0) {
      this.state = 'dying';
      this.exitTimer = 80;
    }
  },

  update() {
    this.bobPhase += 0.05;

    if (this.state === 'enter') {
      const targetX = W - 100;
      this.x += (targetX - this.x) * 0.04;
      if (Math.abs(this.x - targetX) < 2) {
        this.state = 'fight';
        this.x = targetX;
      }
    } else if (this.state === 'fight') {
      this.y = 150 + Math.sin(this.bobPhase) * 35;
      // Boss 2 sways horizontally too
      if (this.level === 2) this.x = W - 100 + Math.cos(this.bobPhase * 0.7) * 25;
      if (this.level === 3) this.x = W - 110 + Math.cos(this.bobPhase * 1.2) * 35;
      if (this.level === 4) {
        this.x = W - 110 + Math.cos(this.bobPhase * 0.9) * 30;
        this.y = 160 + Math.sin(this.bobPhase * 1.1) * 40;
      }

      this.shotTimer--;
      if (this.shotTimer <= 0) {
        this.shoot();
        this.shotTimer = this.config.shotInterval;
      }
    } else if (this.state === 'dying') {
      this.exitTimer--;
      this.y += 2;
      this.x += 1;
      if (this.exitTimer <= 0) {
        this.active = false;
        if (this.level === 4) stopBossMusic();
        bossesDefeated++;
        if (bossesDefeated >= MAX_BOSSES) {
          state = 'victory';
          submitScore();
        } else {
          state = 'playing';
        }
      }
    }
    if (this.hitFlash > 0) this.hitFlash--;
  },

  shoot() {
    const pattern = this.config.shotPattern;
    const baseSpeed = pattern === 'rapid' ? 5 : 4;
    if (pattern === 'aimed' || pattern === 'rapid') {
      const dx = pigeon.x - this.x;
      const dy = pigeon.y - this.y + 10;
      const dist = Math.sqrt(dx * dx + dy * dy);
      fireballs.push({
        x: this.x - 30, y: this.y + 10,
        vx: (dx / dist) * baseSpeed,
        vy: (dy / dist) * baseSpeed,
        life: 0, radius: 12, level: this.level
      });
    } else if (pattern === 'spread') {
      const dx = pigeon.x - this.x;
      const dy = pigeon.y - this.y + 10;
      const baseAngle = Math.atan2(dy, dx);
      for (const off of [-0.25, 0, 0.25]) {
        const a = baseAngle + off;
        fireballs.push({
          x: this.x - 30, y: this.y + 10,
          vx: Math.cos(a) * baseSpeed,
          vy: Math.sin(a) * baseSpeed,
          life: 0, radius: 11, level: this.level
        });
      }
    }
  },

  draw() {
    ctx.save();
    ctx.translate(this.x, this.y);

    if (this.state === 'dying') {
      ctx.rotate(this.exitTimer * -0.04);
      ctx.globalAlpha = this.exitTimer / 80;
    }

    if (this.hitFlash > 0 && this.hitFlash % 4 < 2) {
      ctx.filter = 'brightness(2)';
    }

    if (this.level === 1) drawBoss1.call(this);
    else if (this.level === 2) drawBoss2.call(this);
    else if (this.level === 3) drawBoss3.call(this);
    else if (this.level === 4) drawBoss4.call(this);

    ctx.filter = 'none';
    ctx.restore();

    // HP bar
    if (this.state === 'fight' || this.state === 'enter') {
      const barW = 100;
      const barX = this.x - barW / 2;
      const barY = this.y - 60;
      ctx.fillStyle = 'rgba(0,0,0,0.7)';
      ctx.fillRect(barX - 2, barY - 2, barW + 4, 12);
      ctx.fillStyle = '#400';
      ctx.fillRect(barX, barY, barW, 8);
      const ratio = Math.max(0, this.hp / this.maxHp);
      const hpG = ctx.createLinearGradient(barX, 0, barX + barW, 0);
      if (this.level === 1) { hpG.addColorStop(0, '#e94560'); hpG.addColorStop(1, '#ff7080'); }
      else if (this.level === 2) { hpG.addColorStop(0, '#9933ff'); hpG.addColorStop(1, '#cc66ff'); }
      else if (this.level === 3) { hpG.addColorStop(0, '#ffaa00'); hpG.addColorStop(1, '#ffee44'); }
      else { hpG.addColorStop(0, '#00966e'); hpG.addColorStop(0.5, '#ffffff'); hpG.addColorStop(1, '#d62612'); }
      ctx.fillStyle = hpG;
      ctx.fillRect(barX, barY, barW * ratio, 8);

      ctx.fillStyle = '#fff';
      ctx.font = 'bold 11px Arial';
      ctx.textAlign = 'center';
      ctx.shadowColor = '#000';
      ctx.shadowBlur = 3;
      ctx.fillText(this.config.name + '  ' + this.hp + '/' + this.maxHp, this.x, barY - 6);
      ctx.shadowBlur = 0;
    }
  }
};

// Boss 1 - Krvavi Orao (Red Demon Eagle)
function drawBoss1() {
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.beginPath();
  ctx.ellipse(5, 40, 40, 8, 0, 0, Math.PI * 2);
  ctx.fill();

  // Tail
  ctx.fillStyle = '#3a0a1a';
  ctx.beginPath();
  ctx.moveTo(28, 4); ctx.lineTo(52, 14); ctx.lineTo(46, 0);
  ctx.lineTo(52, -12); ctx.lineTo(28, -4);
  ctx.closePath();
  ctx.fill();

  // Wings
  const wingFlap = Math.sin(this.bobPhase * 3) * 6;
  ctx.fillStyle = '#5a0a1a';
  ctx.beginPath();
  ctx.ellipse(-10, -10 + wingFlap, 28, 16, 0.3, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#7a1a2a';
  ctx.beginPath();
  ctx.ellipse(-10, -8 + wingFlap, 22, 12, 0.3, 0, Math.PI * 2);
  ctx.fill();

  // Body
  const bg = ctx.createRadialGradient(-4, -4, 4, 0, 0, 38);
  bg.addColorStop(0, '#a02030');
  bg.addColorStop(0.6, '#601020');
  bg.addColorStop(1, '#300810');
  ctx.fillStyle = bg;
  ctx.beginPath();
  ctx.ellipse(0, 4, 32, 26, 0, 0, Math.PI * 2);
  ctx.fill();

  // Belly spikes
  ctx.fillStyle = '#2a0008';
  for (let i = -2; i <= 2; i++) {
    ctx.beginPath();

// =================== PROJECTILES ===================
let fireballs = []; // boss fireballs
let bullets = [];  // player bullets

function updateFireballs() {
  fireballs.forEach(f => {
    f.x += f.vx; f.y += f.vy; f.life++;
  });
  fireballs = fireballs.filter(f => f.x > -30 && f.x < W + 30 && f.y > -30 && f.y < H + 30 && f.life < 400);
}

function drawFireballs() {
  fireballs.forEach(f => {
    if (f.level === 4) {
      // Bugarska zastava projektil
      const w = 22, h = 16;
      const angle = Math.atan2(f.vy, f.vx);
      const wave = Math.sin(f.life * 0.4) * 1.5;

      // Trail (suptilan zlatni)
      for (let i = 1; i < 5; i++) {
        ctx.fillStyle = `rgba(255, 240, 200, ${0.3 - i * 0.06})`;
        ctx.beginPath();
        ctx.arc(f.x - f.vx * i * 1.5, f.y - f.vy * i * 1.5, 7 - i, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.save();
      ctx.translate(f.x, f.y);
      ctx.rotate(angle);

      // Glow iza zastave
      ctx.shadowColor = 'rgba(255, 255, 255, 0.8)';
      ctx.shadowBlur = 10;

      // Zastava 3 trake: belo / zeleno / crveno
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(-w / 2, -h / 2 + wave * 0.3, w, h / 3);
      ctx.fillStyle = '#00966e';
      ctx.fillRect(-w / 2, -h / 2 + h / 3, w, h / 3);
      ctx.fillStyle = '#d62612';
      ctx.fillRect(-w / 2, -h / 2 + 2 * h / 3 - wave * 0.3, w, h / 3);

      ctx.shadowBlur = 0;

      // Ivica
      ctx.strokeStyle = '#222';
      ctx.lineWidth = 1;
      ctx.strokeRect(-w / 2, -h / 2, w, h);

      // Mala "drska" zastave
      ctx.fillStyle = '#8a6633';
      ctx.fillRect(-w / 2 - 2, -h / 2 - 2, 2, h + 4);

      ctx.restore();
      return;
    }

    // Color by boss level
    let colors;
    if (f.level === 2) colors = { trail: 'rgba(180, 60, 255, ', core1: '#f0c0ff', core2: '#aa44ff', core3: '#5500aa' };
    else if (f.level === 3) colors = { trail: 'rgba(255, 240, 100, ', core1: '#ffffff', core2: '#ffdd00', core3: '#aa6600' };
    else colors = { trail: 'rgba(255, 100, 0, ', core1: '#fff8a0', core2: '#ffaa00', core3: '#cc2200' };

    for (let i = 0; i < 6; i++) {
      ctx.fillStyle = colors.trail + (0.4 - i * 0.06) + ')';
      ctx.beginPath();
      ctx.arc(f.x - f.vx * i * 2, f.y - f.vy * i * 2, f.radius - i, 0, Math.PI * 2);
      ctx.fill();
    }

    const g = ctx.createRadialGradient(f.x, f.y, 1, f.x, f.y, f.radius);
    g.addColorStop(0, colors.core1);
    g.addColorStop(0.4, colors.core2);
    g.addColorStop(1, colors.core3);
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(f.x, f.y, f.radius, 0, Math.PI * 2);
    ctx.fill();
  });
}

let lastShotTime = 0;
const SHOT_COOLDOWN = 1000; // 1 projektil u sekundi

function shootBullet() {
  if (state !== 'boss' || !boss.active || boss.state === 'dying') return;
  const now = performance.now();
  if (now - lastShotTime < SHOT_COOLDOWN) return;
  lastShotTime = now;
  const dx = mouseX - pigeon.x;
  const dy = mouseY - pigeon.y;
  const dist = Math.sqrt(dx * dx + dy * dy) || 1;
  const speed = 8;
  bullets.push({
    x: pigeon.x + 20, y: pigeon.y - 5,
    vx: (dx / dist) * speed,
    vy: (dy / dist) * speed,
    life: 0
  });
}

function updateBullets() {
  bullets.forEach(b => { b.x += b.vx; b.y += b.vy; b.life++; });
  bullets = bullets.filter(b => b.x > -20 && b.x < W + 20 && b.y > -20 && b.y < H + 20 && b.life < 200);

  // Hit detection vs boss
  if (boss.active && (boss.state === 'fight' || boss.state === 'enter')) {
    for (let i = bullets.length - 1; i >= 0; i--) {
      const b = bullets[i];
      const dx = b.x - boss.x;
      const dy = b.y - boss.y;
      if (Math.sqrt(dx * dx + dy * dy) < 36) {
        bullets.splice(i, 1);
        boss.hit();
      }
    }
  }
}

function drawBullets() {
  bullets.forEach(b => {
    // Trail
    for (let i = 0; i < 5; i++) {
      ctx.fillStyle = `rgba(200, 240, 255, ${0.5 - i * 0.1})`;
      ctx.beginPath();
      ctx.arc(b.x - b.vx * i * 0.8, b.y - b.vy * i * 0.8, 5 - i * 0.7, 0, Math.PI * 2);
      ctx.fill();
    }
    // Core - feather/star shape
    const g = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, 6);
    g.addColorStop(0, '#fff');
    g.addColorStop(0.5, '#88ddff');
    g.addColorStop(1, '#2266aa');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(b.x, b.y, 5, 0, Math.PI * 2);
    ctx.fill();
  });
}

// =================== CROSSHAIR ===================
function drawCrosshair() {
  if (state !== 'boss') return;

  const now = performance.now();
  const cdRatio = Math.min(1, (now - lastShotTime) / SHOT_COOLDOWN);
  const ready = cdRatio >= 1;

  const color = ready ? 'rgba(80, 255, 120, 0.9)' : 'rgba(255, 80, 80, 0.7)';
  ctx.strokeStyle = color;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(mouseX, mouseY, 12, 0, Math.PI * 2);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(mouseX - 18, mouseY); ctx.lineTo(mouseX - 6, mouseY);
  ctx.moveTo(mouseX + 6, mouseY); ctx.lineTo(mouseX + 18, mouseY);
  ctx.moveTo(mouseX, mouseY - 18); ctx.lineTo(mouseX, mouseY - 6);
  ctx.moveTo(mouseX, mouseY + 6); ctx.lineTo(mouseX, mouseY + 18);
  ctx.stroke();

  // Cooldown arc
  if (!ready) {
    ctx.strokeStyle = 'rgba(255, 220, 80, 0.9)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(mouseX, mouseY, 18, -Math.PI / 2, -Math.PI / 2 + cdRatio * Math.PI * 2);
    ctx.stroke();
  } else {
    // "READY" pulse
    const pulse = 0.5 + Math.sin(now * 0.01) * 0.3;
    ctx.fillStyle = `rgba(80, 255, 120, ${pulse * 0.4})`;
    ctx.beginPath();
    ctx.arc(mouseX, mouseY, 20, 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.strokeStyle = ready ? 'rgba(80, 255, 120, 0.2)' : 'rgba(255, 80, 80, 0.12)';
  ctx.lineWidth = 1;
  ctx.setLineDash([4, 6]);
  ctx.beginPath();
  ctx.moveTo(pigeon.x + 20, pigeon.y);
  ctx.lineTo(mouseX, mouseY);
  ctx.stroke();
  ctx.setLineDash([]);
}

// =================== COLLISION ===================
function checkCollision() {
  if (pigeon.y - pigeon.radius + 8 < 0 || pigeon.y + pigeon.radius - 8 > H - 30) return true;
  for (const p of pipes) {
    const r = pigeon.radius - 5;
    if (pigeon.x + r > p.x && pigeon.x - r < p.x + PIPE_W) {
      if (pigeon.y - r < p.topH || pigeon.y + r > p.topH + PIPE_GAP) return true;
    }
  }
  for (const f of fireballs) {
    const dx = f.x - pigeon.x;
    const dy = f.y - pigeon.y;
    if (Math.sqrt(dx * dx + dy * dy) < f.radius + pigeon.radius - 6) return true;
  }
  return false;
}

let bgX = 0;
let lightningTimer = 0;
let lightningFlash = 0;
let stars = Array.from({ length: 40 }, () => ({

  size: 1 + Math.random() * 1.5, twinkle: Math.random() * Math.PI * 2

function getBgTheme() {
  if (state !== 'boss') return 'day';
  return boss.config ? boss.config.bgTheme : 'day';
}

function drawBackground() {
  const theme = getBgTheme();
  const sky = ctx.createLinearGradient(0, 0, 0, H);

  if (theme === 'sunset') {
    sky.addColorStop(0, '#5a2030');
    sky.addColorStop(0.5, '#c04050');
    sky.addColorStop(1, '#f08050');
  } else if (theme === 'storm') {
    const flash = lightningFlash > 0 ? 0.4 : 0;
    sky.addColorStop(0, `rgba(${20 + flash * 200},${10 + flash * 200},${40 + flash * 200},1)`);
    sky.addColorStop(0.6, `rgba(${40 + flash * 180},${20 + flash * 180},${70 + flash * 180},1)`);
    sky.addColorStop(1, `rgba(${70 + flash * 150},${40 + flash * 150},${100 + flash * 150},1)`);
  } else if (theme === 'epic') {
    sky.addColorStop(0, '#ff7700');
    sky.addColorStop(0.5, '#ffbb44');
    sky.addColorStop(1, '#ffee88');
  } else if (theme === 'sky') {
    sky.addColorStop(0, '#1a5aaa');
    sky.addColorStop(0.5, '#5a99dd');
    sky.addColorStop(1, '#aaddff');
  } else {
    sky.addColorStop(0, '#4a90d9');
    sky.addColorStop(0.6, '#87ceeb');
    sky.addColorStop(1, '#b0e0f8');
  }
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, H);

  // Stars in storm theme
  if (theme === 'storm') {
    stars.forEach(s => {
      s.twinkle += 0.05;
      ctx.fillStyle = `rgba(255,255,255,${0.5 + Math.sin(s.twinkle) * 0.3})`;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
      ctx.fill();
    });

    lightningTimer--;
    if (lightningTimer <= 0) {
      lightningFlash = 8;
      lightningTimer = 60 + Math.random() * 120;
    }
    if (lightningFlash > 0) {
      lightningFlash--;
      // Lightning bolt
      if (lightningFlash > 4) {
        ctx.strokeStyle = `rgba(255,255,255,${lightningFlash / 8})`;
        ctx.lineWidth = 2;
        ctx.beginPath();
        let lx = 50 + Math.random() * (W - 100);
        let ly = 0;
        ctx.moveTo(lx, ly);
        while (ly < 300) {
          lx += (Math.random() - 0.5) * 30;
          ly += 20 + Math.random() * 20;
          ctx.lineTo(lx, ly);
        }
        ctx.stroke();
      }
    }
  }

  // Sun/Moon
  if (theme === 'sunset') {
    const sg = ctx.createRadialGradient(W - 80, 120, 10, W - 80, 120, 50);
    sg.addColorStop(0, '#ffeebb');
    sg.addColorStop(0.5, '#ff8844');
    sg.addColorStop(1, 'rgba(255, 100, 50, 0)');
    ctx.fillStyle = sg;
    ctx.beginPath();
    ctx.arc(W - 80, 120, 50, 0, Math.PI * 2);
    ctx.fill();
  } else if (theme === 'storm') {
    ctx.fillStyle = '#ccccdd';
    ctx.beginPath();
    ctx.arc(W - 80, 100, 28, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = 'rgba(20,20,40,1)';
    ctx.beginPath();
    ctx.arc(W - 70, 92, 24, 0, Math.PI * 2);
    ctx.fill();
  } else if (theme === 'epic') {
    const sg = ctx.createRadialGradient(W / 2, 80, 10, W / 2, 80, 70);
    sg.addColorStop(0, '#ffffff');
    sg.addColorStop(0.4, '#ffee88');
    sg.addColorStop(1, 'rgba(255, 220, 100, 0)');
    ctx.fillStyle = sg;
    ctx.beginPath();
    ctx.arc(W / 2, 80, 70, 0, Math.PI * 2);
    ctx.fill();
    // Light rays
    ctx.strokeStyle = 'rgba(255, 240, 180, 0.2)';
    ctx.lineWidth = 30;
    for (let i = 0; i < 6; i++) {
      const a = (i / 6) * Math.PI * 2 + frames * 0.003;
      ctx.beginPath();
      ctx.moveTo(W / 2, 80);
      ctx.lineTo(W / 2 + Math.cos(a) * 400, 80 + Math.sin(a) * 400);
      ctx.stroke();
    }
  }

  // Mountains in epic
  if (theme === 'epic') {
    ctx.fillStyle = '#6a4a2a';
    ctx.beginPath();
    ctx.moveTo(0, H - 30);
    ctx.lineTo(0, H - 180);
    ctx.lineTo(80, H - 240);
    ctx.lineTo(160, H - 180);
    ctx.lineTo(240, H - 280);
    ctx.lineTo(320, H - 200);
    ctx.lineTo(400, H - 240);
    ctx.lineTo(400, H - 30);
    ctx.closePath();
    ctx.fill();
    // Snow caps
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.moveTo(70, H - 230); ctx.lineTo(80, H - 240); ctx.lineTo(90, H - 230);
    ctx.lineTo(86, H - 226); ctx.lineTo(80, H - 232); ctx.lineTo(74, H - 226);
    ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(230, H - 270); ctx.lineTo(240, H - 280); ctx.lineTo(250, H - 270);
    ctx.lineTo(246, H - 266); ctx.lineTo(240, H - 272); ctx.lineTo(234, H - 266);
    ctx.closePath(); ctx.fill();
  }

  // Clouds
  clouds.forEach(c => {
    if (state === 'playing' || state === 'boss') c.x -= c.speed;
    if (c.x + c.w < 0) { c.x = W + 20; c.y = 30 + Math.random() * 200; }
    let cloudColor = 'rgba(255,255,255,0.85)';
    if (theme === 'sunset') cloudColor = 'rgba(120, 50, 70, 0.8)';
    else if (theme === 'storm') cloudColor = 'rgba(40, 30, 60, 0.85)';
    else if (theme === 'epic') cloudColor = 'rgba(255, 220, 160, 0.7)';
    else if (theme === 'sky') cloudColor = 'rgba(255,255,255,0.95)';
    ctx.fillStyle = cloudColor;
    ctx.beginPath();
    ctx.arc(c.x, c.y, c.w * 0.3, 0, Math.PI * 2);
    ctx.arc(c.x + c.w * 0.3, c.y - c.w * 0.1, c.w * 0.25, 0, Math.PI * 2);
    ctx.arc(c.x + c.w * 0.6, c.y, c.w * 0.28, 0, Math.PI * 2);
    ctx.fill();
  });

  // Contrails (kondenzacioni tragovi) za sky temu
  if (theme === 'sky') {
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
    ctx.lineWidth = 3;
    ctx.setLineDash([12, 8]);
    ctx.beginPath();
    ctx.moveTo(0, 80 + Math.sin(frames * 0.005) * 5);
    ctx.lineTo(W, 100 + Math.cos(frames * 0.005) * 5);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(0, 220 + Math.sin(frames * 0.004 + 1) * 5);
    ctx.lineTo(W, 200 + Math.cos(frames * 0.004 + 1) * 5);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  // Buildings (skip for epic and sky - we're high in the air)
  if (theme !== 'epic' && theme !== 'sky') {
    if (state === 'playing' || state === 'boss') bgX -= 0.5;
    buildings.forEach(b => {
      const bx = ((b.x - bgX) % (W + 60) + W + 60) % (W + 60) - 30;
      let bldColor = '#2a3a5a';
      let winColor = 'rgba(255, 240, 100, 0.6)';
      if (theme === 'sunset') { bldColor = '#1a0a18'; winColor = 'rgba(255, 100, 60, 0.7)'; }
      else if (theme === 'storm') { bldColor = '#0a0510'; winColor = 'rgba(180, 100, 255, 0.6)'; }
      ctx.fillStyle = bldColor;
      ctx.fillRect(bx, H - 30 - b.h, b.w, b.h);
      ctx.fillStyle = winColor;
      b.windows.forEach(w => { if (w.lit) ctx.fillRect(bx + w.x, H - 30 - b.h + w.y, 6, 8); });
    });
  }

  // Ground
  const groundG = ctx.createLinearGradient(0, H - 30, 0, H);
  if (theme === 'sunset') { groundG.addColorStop(0, '#4a2010'); groundG.addColorStop(1, '#2a1008'); }
  else if (theme === 'storm') { groundG.addColorStop(0, '#1a0a2a'); groundG.addColorStop(1, '#0a0418'); }
  else if (theme === 'epic') { groundG.addColorStop(0, '#aa7744'); groundG.addColorStop(1, '#7a4a22'); }
  else if (theme === 'sky') { groundG.addColorStop(0, '#cce4f8'); groundG.addColorStop(1, '#aaccee'); }
  else { groundG.addColorStop(0, '#5a8a3a'); groundG.addColorStop(1, '#3a6a2a'); }
  ctx.fillStyle = groundG;
  ctx.fillRect(0, H - 30, W, 30);
  let topColor = '#7aaa5a';
  if (theme === 'sunset') topColor = '#6a3020';
  else if (theme === 'storm') topColor = '#2a1442';
  else if (theme === 'epic') topColor = '#ccaa66';
  else if (theme === 'sky') topColor = '#ffffff';
  ctx.fillStyle = topColor;
  ctx.fillRect(0, H - 30, W, 6);
}

let victoryParticles = [];
let victoryFrames = 0;

function spawnVictoryParticles() {
  if (victoryFrames % 3 === 0) {
    for (let i = 0; i < 3; i++) {
      victoryParticles.push({
        x: Math.random() * W,
        y: -10,
        vx: (Math.random() - 0.5) * 2,
        vy: 1 + Math.random() * 3,
        size: 4 + Math.random() * 6,
        color: ['#ffd700', '#ff4488', '#44aaff', '#44ff88', '#ff8844'][Math.floor(Math.random() * 5)],
        rot: Math.random() * Math.PI * 2,
        vrot: (Math.random() - 0.5) * 0.2
      });
    }
  }
  victoryParticles.forEach(p => {
    p.x += p.vx;
    p.y += p.vy;
    p.rot += p.vrot;
  });
  victoryParticles = victoryParticles.filter(p => p.y < H + 20);
}

function drawVictoryParticles() {
  victoryParticles.forEach(p => {
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot);
    ctx.fillStyle = p.color;
    ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
    ctx.restore();
  });
}

function drawVictory() {
  // Epic golden background
  const sky = ctx.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, '#ff7700');
  sky.addColorStop(0.5, '#ffcc44');
  sky.addColorStop(1, '#ffee88');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, H);

  // Sun rays
  ctx.save();
  ctx.translate(W / 2, 180);
  ctx.rotate(victoryFrames * 0.005);
  ctx.fillStyle = 'rgba(255, 255, 200, 0.3)';
  for (let i = 0; i < 12; i++) {
    ctx.rotate(Math.PI / 6);
    ctx.beginPath();
    ctx.moveTo(-15, 0);
    ctx.lineTo(15, 0);
    ctx.lineTo(0, 400);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();

  spawnVictoryParticles();
  drawVictoryParticles();

  // Trophy
  const tx = W / 2;
  const ty = 220 + Math.sin(victoryFrames * 0.05) * 6;

  // Trophy glow
  const glowG = ctx.createRadialGradient(tx, ty, 20, tx, ty, 120);
  glowG.addColorStop(0, 'rgba(255, 240, 100, 0.6)');
  glowG.addColorStop(1, 'rgba(255, 240, 100, 0)');
  ctx.fillStyle = glowG;
  ctx.beginPath();
  ctx.arc(tx, ty, 120, 0, Math.PI * 2);
  ctx.fill();

  // Trophy base
  ctx.fillStyle = '#8a5a20';
  ctx.beginPath();
  ctx.roundRect(tx - 40, ty + 60, 80, 16, 4);
  ctx.fill();
  ctx.fillStyle = '#6a4218';
  ctx.fillRect(tx - 30, ty + 50, 60, 14);
  ctx.fillStyle = '#aa7a40';
  ctx.beginPath();
  ctx.roundRect(tx - 8, ty + 30, 16, 24, 2);
  ctx.fill();

  // Trophy cup
  const cupG = ctx.createLinearGradient(tx - 40, ty - 40, tx + 40, ty + 40);
  cupG.addColorStop(0, '#fff4b0');
  cupG.addColorStop(0.4, '#ffd700');
  cupG.addColorStop(0.7, '#cc9900');
  cupG.addColorStop(1, '#8a6600');
  ctx.fillStyle = cupG;
  ctx.beginPath();
  ctx.moveTo(tx - 40, ty - 40);
  ctx.lineTo(tx - 35, ty + 30);
  ctx.lineTo(tx + 35, ty + 30);
  ctx.lineTo(tx + 40, ty - 40);
  ctx.quadraticCurveTo(tx, ty - 60, tx - 40, ty - 40);
  ctx.closePath();
  ctx.fill();

  // Cup rim
  ctx.fillStyle = '#ffee88';
  ctx.beginPath();
  ctx.ellipse(tx, ty - 38, 38, 8, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#cc9900';
  ctx.beginPath();
  ctx.ellipse(tx, ty - 36, 32, 5, 0, 0, Math.PI * 2);
  ctx.fill();

  // Handles
  ctx.strokeStyle = '#ffd700';
  ctx.lineWidth = 8;
  ctx.beginPath();
  ctx.arc(tx - 40, ty - 10, 18, -0.4, Math.PI + 0.4);
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(tx + 40, ty - 10, 18, -Math.PI - 0.4, 0.4);
  ctx.stroke();

  // Cup shine
  ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
  ctx.beginPath();
  ctx.ellipse(tx - 20, ty - 20, 5, 22, -0.2, 0, Math.PI * 2);
  ctx.fill();

  // Star on cup
  ctx.fillStyle = '#ff4488';
  ctx.shadowColor = '#fff'; ctx.shadowBlur = 8;
  drawStar(tx, ty, 5, 10, 5);
  ctx.shadowBlur = 0;

  // Text
  ctx.fillStyle = '#5a2a00';
  ctx.font = 'bold 44px Arial';
  ctx.textAlign = 'center';
  ctx.shadowColor = '#fff'; ctx.shadowBlur = 10;
  ctx.fillText('POBEDA!', W / 2, 80);
  ctx.shadowBlur = 0;

  ctx.fillStyle = '#5a2a00';
  ctx.font = 'bold 18px Arial';
  ctx.fillText('Pobedio si sva 4 bossa!', W / 2, 110);

  ctx.fillStyle = '#3a1a00';
  ctx.font = 'bold 16px Arial';
  ctx.fillText('Rezultat: ' + score, W / 2, 340);
  ctx.fillText('🏆 ŠAMPION 🏆', W / 2, 365);

  // Buttons
  victoryButtons.forEach(b => {
    const hover = pointInButton(mouseX, mouseY, b);
    ctx.fillStyle = hover ? '#e94560' : '#c93550';
    ctx.beginPath();
    ctx.roundRect(b.x, b.y, b.w, b.h, 10);
    ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 16px Arial';
    ctx.textAlign = 'center';
    ctx.fillText(b.label, b.x + b.w / 2, b.y + b.h / 2 + 6);
  });

  victoryFrames++;
}

function drawStar(cx, cy, spikes, outerR, innerR) {
  let rot = -Math.PI / 2;
  const step = Math.PI / spikes;
  ctx.beginPath();
  ctx.moveTo(cx + Math.cos(rot) * outerR, cy + Math.sin(rot) * outerR);
  for (let i = 0; i < spikes; i++) {
    rot += step;
    ctx.lineTo(cx + Math.cos(rot) * innerR, cy + Math.sin(rot) * innerR);
    rot += step;
    ctx.lineTo(cx + Math.cos(rot) * outerR, cy + Math.sin(rot) * outerR);
  }
  ctx.closePath();
  ctx.fill();
}

// =================== NAME PROMPT ===================
let pendingScoreSave = false;

function promptName(force) {
  const def = playerName || 'Igrac';
  const msg = force
    ? 'Promeni svoje ime:'
    : 'Unesi svoje ime za rang listu:';
  const name = prompt(msg, def);
  if (name !== null) {
    const cleaned = (name.substring(0, 12).trim()) || 'Anonim';
    playerName = cleaned;
    try { localStorage.setItem('flappyGolubName', cleaned); } catch (e) {}
    if (!force) {
      if (isTopScore(score)) tryAddHighScore(cleaned, score);
      if (ONLINE_ENABLED && score > 0) postGlobalScore(cleaned, score, bossesDefeated);
    }
    buildMenuButtons();
  }
  pendingScoreSave = false;
}

function submitScore() {
  if (score <= 0) return;
  if (!playerName) {
    pendingScoreSave = true;
    setTimeout(() => promptName(false), 400);
  } else {
    if (isTopScore(score)) tryAddHighScore(playerName, score);
    if (ONLINE_ENABLED) postGlobalScore(playerName, score, bossesDefeated);
  }
}

// =================== START / RESTART ===================
function startGame() {
  stopBossMusic();
  state = 'playing';
  score = 0;
  frames = 0;
  pipes = [];
  fireballs = [];
  bullets = [];
  victoryParticles = [];
  victoryFrames = 0;
  boss.active = false;
  bossesDefeated = 0;
  currentBossLevel = 0;
  pigeon.reset();
  pigeon.flap();

  // Test mode: ?boss=N -> odmah skoči u borbu sa bossom N
  if (urlStartBoss >= 1 && urlStartBoss <= MAX_BOSSES) {
    bossesDefeated = urlStartBoss - 1;
    score = urlStartBoss * BOSS_TRIGGER;
    triggerBoss();
    return;
  }

  // Test mode: ?start=N -> krećeš sa skorom N
  if (urlStartScore > 0) {
    score = urlStartScore;
    bossesDefeated = Math.min(MAX_BOSSES, Math.floor(score / BOSS_TRIGGER));
  }
}

// =================== LOOP ===================
let prevState = null;

function gameLoop() {
  ctx.clearRect(0, 0, W, H);

  if (state !== prevState) {
    if (state === 'menu' && ONLINE_ENABLED) fetchGlobalScores();
    prevState = state;
  }

  if (state === 'menu') {
    drawBackground();
    drawMenu();
    frames++;
    requestAnimationFrame(gameLoop);
    return;
  }

  if (state === 'victory') {
    drawVictory();
    requestAnimationFrame(gameLoop);
    return;
  }

  drawBackground();
  pipes.forEach(p => drawPipe(p.x, p.topH));
  updatePipes();

  if (state === 'boss') {
    boss.update();
    boss.draw();
  }

  updateFireballs();
  drawFireballs();
  updateBullets();
  drawBullets();

  pigeon.update();
  pigeon.draw();

  if (state === 'boss') drawCrosshair();

  if (state === 'playing' || state === 'boss') {
    frames++;
    if (checkCollision()) {
      state = 'dead';
      stopBossMusic();
      submitScore();
      if (score > hiScore) hiScore = score;
    }
  }

  if (state === 'playing' || state === 'boss') drawHUD();
  if (state === 'dead') { drawHUD(); drawDead(); }

  requestAnimationFrame(gameLoop);
}

// =================== INPUT ===================
document.addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'ArrowUp') {
    e.preventDefault();
    if (state === 'menu' || state === 'dead') startGame();
    else if (state === 'playing' || state === 'boss') pigeon.flap();
    else if (state === 'victory') { /* ignore - use buttons */ }
  }
});

function canvasCoords(clientX, clientY) {
  const rect = canvas.getBoundingClientRect();
  return {
    x: (clientX - rect.left) * (W / rect.width),
    y: (clientY - rect.top) * (H / rect.height)
  };
}

function handlePointerDown(x, y, isTouch) {
  if (isTouch) { mouseX = x; mouseY = y; }

  if (state === 'menu') {
    for (const t of menuTabButtons) {
      if (pointInButton(x, y, t)) { selectedTab = t.key; return; }
    }
    for (const b of menuButtons) {
      if (b.label && pointInButton(x, y, b)) { b.action(); return; }
    }
    return;
  }
  if (state === 'dead') {
    for (const b of deadButtons) {
      if (pointInButton(x, y, b)) { b.action(); return; }
    }
    return;
  }
  if (state === 'victory') {
    for (const b of victoryButtons) {
      if (pointInButton(x, y, b)) { b.action(); return; }
    }
    return;
  }
  if (state === 'boss') {
    if (isTouch) {
      // Na telefonu: tap = pucaj + lepet (dvostruka akcija)
      shootBullet();
      pigeon.flap();
    } else {
      shootBullet();
    }
    return;
  }
  if (state === 'playing') {
    pigeon.flap();
    return;
  }
}

canvas.addEventListener('mousedown', e => {
  const p = canvasCoords(e.clientX, e.clientY);
  handlePointerDown(p.x, p.y, false);
});

canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  if (e.touches.length === 0) return;
  const t = e.touches[0];
  const p = canvasCoords(t.clientX, t.clientY);
  handlePointerDown(p.x, p.y, true);
}, { passive: false });

canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  if (e.touches.length === 0) return;
  const t = e.touches[0];
  const p = canvasCoords(t.clientX, t.clientY);
  mouseX = p.x;
  mouseY = p.y;
}, { passive: false });

gameLoop();
</script>
